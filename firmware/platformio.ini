[platformio]
default_envs = tdeck-plus-915
boards_dir = ../third_party/MeshCore/boards

[env]
platform = espressif32
board = t-deck
framework = arduino
monitor_speed = 115200
extra_scripts =
  pre:scripts/ccache.py
  pre:scripts/wifi_flags.py
lib_ldf_mode = chain+
board_build.partitions = partitions_ota_16mb.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
build_flags =
  -D TDECK_PLUS
  -D APP_TARGET_TDECK_PLUS=1
  -D APP_ENABLE_TDECK_DISPLAY=1
  -D APP_ENABLE_RADIOLIB=1
  -D APP_ENABLE_BLE=1
  -D APP_ENABLE_SD_STORAGE=0
  -D APP_ENABLE_WIFI_OTA=1
  -D APP_WIFI_OTA_HOSTNAME='"meshcore-tdeck"'
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MSC_ON_BOOT=0
  -D ARDUINO_USB_DFU_ON_BOOT=0
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  -D LV_CONF_INCLUDE_SIMPLE
  -D BOARD_HAS_PSRAM
  -D USER_SETUP_LOADED
  -D ST7789_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=38
  -D TFT_MOSI=41
  -D TFT_SCLK=40
  -D TFT_CS=12
  -D TFT_DC=11
  -D TFT_RST=-1
  -D TFT_RGB_ORDER=TFT_RGB
  -D INIT_SEQUENCE_2
  -D LOAD_GLCD
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -I include
  -I ../common
  -I ../third_party/MeshCore/src
  -I ../third_party/MeshCore/lib/ed25519
lib_deps =
  SPI
  Wire
  lvgl/lvgl
  lovyan03/LovyanGFX@1.2.21
  jgromes/RadioLib
  symlink://../third_party/MeshCore
  meshcore_ed25519
  rweather/Crypto@^0.4.0
  adafruit/RTClib@^2.1.3
  melopero/Melopero RV3028@^1.1.0
  electroniccats/CayenneLPP@1.6.1

[env:tdeck-plus-915]
build_flags =
  ${env.build_flags}
  -D REGION_915

[env:tdeck-plus-868]
build_flags =
  ${env.build_flags}
  -D REGION_868

[env:tdeck-plus-433]
build_flags =
  ${env.build_flags}
  -D REGION_433
